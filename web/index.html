<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NetPulse</title>
    <script>
      // Apply the stored theme before first paint so a dark choice never flashes light.
      // Mirrors readTheme() in src/state/theme.ts; main.tsx re-applies it authoritatively.
      try {
        var t = localStorage.getItem("netpulse.theme");
        var dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
